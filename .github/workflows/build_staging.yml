name: Staging Build & Release

on:
  # Runs this action when you push on master
  push:
    branches:
      - stage
  # Runs this when a PR against master is created
  pull_request:
    branches:
      - stage

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Clones the project on the machine
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq (for parsing JSON)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest release tag from GitHub API
        id: get_latest_tag
        run: |
          # Use curl with authentication to query the GitHub API for the latest PUBLISHED release.
          # The -sL flags make it silent and follow redirects.
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          
          # CRITICAL ERROR HANDLING:
          # Check if the tag is empty or the literal string "null" (which jq outputs on error).
          # This prevents the 'tag: null' error in the upload step.
          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "Error: Could not find the latest published release tag via the GitHub API."
            echo "Please ensure a non-prerelease, non-draft release exists in the repository."
            exit 1
          fi
          
          echo "Found latest release tag: $LATEST_TAG"
          echo "TAG_NAME=$LATEST_TAG" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Installs flutter and related dependency on this machine
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.5'
          cache: true

      # Fetches proj dependencies from pub
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create .staging.env file  # Create .dev.env if you have one
        run: |
          echo "${{ secrets.STAGE_ENV }}" > lib/.staging.env

      - name: Build APK (Staging)
        run: flutter build apk --flavor staging --dart-define-from-file=lib/.staging.env --build-number=${{ github.run_number }}

#      - name: Create Sentry release
#        uses: getsentry/action-release@v3
#        env:
#          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
#          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
#          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
#        with:
#          environment: staging
#          version: ${{ needs.version_and_release.outputs.tag_name }}

      - name: Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          # Correct path for release APK
          artifacts: "build/app/outputs/flutter-apk/app-staging-release.apk"
          tag: ${{ needs.version_and_release.outputs.tag_name }}
          token: ${{ secrets.PAT }}
          # Allow updating the release, as release-please created it, and we're just adding an artifact.
          allowUpdates: true
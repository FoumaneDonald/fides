name: fides
description: "A customer loyalty app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+5

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  path_provider: ^2.1.5
  objectbox: ^5.0.0
  objectbox_flutter_libs: ^5.0.0
  result_dart: ^2.0.0
  uuid: ^4.5.1
  get_it: ^8.0.3
  go_router: ^16.2.4
  flutter_svg: ^2.0.17
  flutter_layout_grid: ^2.0.8
  wolt_modal_sheet: ^0.11.0
  sentry_flutter: ^9.7.0
  flutter_dotenv: ^5.2.1
  currency_picker: ^2.0.21
  phone_form_field: ^10.0.2
  hugeicons: ^1.1.0
  beamer: ^1.7.0
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  flex_color_scheme: ^8.3.0
  dart_mappable: ^4.6.1
  image_picker: ^1.2.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  objectbox_generator: ^5.0.0
  dart_mappable_builder: ^4.5.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Livvic
      fonts:
        - asset: assets/fonts/Livvic/Livvic-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: assets/fonts/Livvic/Livvic-Thin.ttf
          weight: 100
        - asset: assets/fonts/Livvic/Livvic-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: assets/fonts/Livvic/Livvic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Livvic/Livvic-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/fonts/Livvic/Livvic-Light.ttf
          weight: 300
        - asset: assets/fonts/Livvic/Livvic-Regular.ttf
          weight: 400
        - asset: assets/fonts/Livvic/Livvic-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Livvic/Livvic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Livvic/Livvic-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/Livvic/Livvic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Livvic/Livvic-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/Livvic/Livvic-Bold.ttf
          weight: 700
        - asset: assets/fonts/Livvic/Livvic-BlackItalic.ttf
          style: italic
          weight: 900
        - asset: assets/fonts/Livvic/Livvic-Black.ttf
          weight: 900


    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans/WorkSans-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: assets/fonts/WorkSans/WorkSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/WorkSans/WorkSans-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: assets/fonts/WorkSans/WorkSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/WorkSans/WorkSans-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/fonts/WorkSans/WorkSans-Light.ttf
          weight: 300
        - asset: assets/fonts/WorkSans/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans/WorkSans-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/WorkSans/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans/WorkSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/WorkSans/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans/WorkSans-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/WorkSans/WorkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/WorkSans/WorkSans-BlackItalic.ttf
          style: italic
          weight: 900
        - asset: assets/fonts/WorkSans/WorkSans-Black.ttf
          weight: 900

